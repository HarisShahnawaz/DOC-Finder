<svg width="260" height="60" viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: magnifying glass + medical cross, two-tone like the reference mark -->
  <g transform="translate(2,4)">
    <!-- lens ring, lighter tone -->
    <circle cx="24" cy="24" r="19" fill="none" stroke="#7C83FD" stroke-width="7"/>
    <!-- handle, darker tone -->
    <rect x="38" y="38" width="10" height="18" rx="5"
          transform="rotate(45 43 47)" fill="#1A0DAB"/>
    <!-- cross inside lens -->
    <rect x="20.5" y="12" width="7" height="24" rx="3.5" fill="#1A0DAB"/>
    <rect x="12" y="20.5" width="24" height="7" rx="3.5" fill="#1A0DAB"/>
    <!-- sparkle accent, echoes reference logo's star -->
    <path d="M50 4 L52 9 L57 11 L52 13 L50 18 L48 13 L43 11 L48 9 Z" fill="#7C83FD"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="39" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">
    <tspan fill="#1A0DAB">DOC</tspan><tspan fill="#1A0DAB">-</tspan><tspan fill="#7C83FD">Finder</tspan>
  </text>
</svg>
